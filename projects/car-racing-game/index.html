<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nitro Racer | Car Racing Game</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <!-- Dashboard/UI -->
        <div class="score-card">
            <span class="label">SCORE</span>
            <span id="score">0000</span>
        </div>

        <div class="high-score">
            <span class="label">HIGH SCORE</span>
            <span id="highScore">0000</span>
        </div>

        <!-- Game World -->
        <div class="game-area">
            <div class="road">
                <!-- Lines will be injected here via JS/CSS -->
            </div>
            <!-- Player car will be injected here -->
        </div>

        <!-- Overlays -->
        <div id="startScreen" class="overlay">
            <div class="glass-panel">
                <h1>NITRO RACER</h1>
                <p>Use <b>Arrow Keys</b> or <b>WASD</b> to move</p>
                <button id="startBtn">START ENGINE</button>
            </div>
        </div>

        <div id="gameOverScreen" class="overlay hidden">
            <div class="glass-panel">
                <h2 class="crash-text">CAR CRASHED!</h2>
                <div class="final-score">Final Score: <span id="finalScore">0</span></div>
                <button id="restartBtn">RETRY</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
